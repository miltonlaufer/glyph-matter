<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>glyph-matter — webcam</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <nav class="caption" aria-label="Examples"></nav>
    <button class="start" type="button">enable camera and mic</button>
    <div class="transport" hidden>
      <button class="stop" type="button">stop</button>
      <div
        class="meter"
        role="meter"
        aria-label="microphone level"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
      >
        <span class="meter-bar"></span>
      </div>
    </div>
    <canvas></canvas>
    <script type="module" src="./webcam.ts"></script>
  </body>
</html>
