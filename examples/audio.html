<html lang="en">
  <head>

    <title>glyph-matter — audio</title>
    <link rel="stylesheet" href="./style.css" />

  <body>
    <nav class="caption" aria-label="Examples"></nav>
    <button class="start" type="button">play Terminal Hours</button>

      </label>
    </div>
    <canvas></canvas>
    <script type="module" src="./audio.ts"></script>
