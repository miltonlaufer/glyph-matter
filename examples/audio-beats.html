<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>glyph-matter — audio beats</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <nav class="caption" aria-label="Examples"></nav>
    <button class="start" type="button">play Terminal Hours</button>
    <div class="transport" hidden>
      <button class="stop" type="button">stop</button>
      <div class="readout" aria-live="polite">
        <div class="readout-row" title="Kick onset envelope — punches the traveling gust">
          <span>kick</span>
          <span class="readout-val" data-k="kick">0.00</span>
          <span class="readout-bar"><i data-bar="kick"></i></span>
        </div>
        <div class="readout-row">
          <span>hats</span>
          <span class="readout-val" data-k="hats">0.00</span>
          <span class="readout-bar"><i data-bar="hats"></i></span>
        </div>
        <div class="readout-row">
          <span>gust</span>
          <span class="readout-val" data-k="gust">0.00</span>
          <span class="readout-bar"><i data-bar="gust"></i></span>
        </div>
        <div class="readout-row">
          <span>bass</span>
          <span class="readout-val" data-k="bass">0.00</span>
          <span class="readout-bar"><i data-bar="bass"></i></span>
        </div>
        <div class="readout-row">
          <span>period</span>
          <span class="readout-val" data-k="period">0.72s</span>
          <span class="readout-bar"><i data-bar="period"></i></span>
        </div>
      </div>
    </div>
    <canvas></canvas>
    <script type="module" src="./audio-beats.ts"></script>
  </body>
</html>
